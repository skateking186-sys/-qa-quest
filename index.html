<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QA Career Academy v20 — Final Release</title><meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#08111f;--card:#111d30;--card2:#16243a;--text:#edf5ff;--muted:#9fb0c7;--accent:#54d6a5;--warn:#ffc857;--bad:#ff6b6b;--line:#263852}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#07101d,#0b1424);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#08111feF;border-bottom:1px solid var(--line);padding:12px 16px;backdrop-filter:blur(10px)}
.brand{font-weight:800;font-size:18px}.sub{font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;padding:10px 0 0}button,.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
button.active,.primary{background:var(--accent);color:#052016;border-color:transparent}.danger{background:#3a1820}.wrap{max-width:1050px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.bar{height:10px;background:#1c2b40;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#1c2d45;color:#bcd0e8;font-size:12px;margin:2px}.phase{margin-bottom:12px}
.module{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}.done{color:var(--accent)}
.option{display:block;width:100%;text-align:left;margin:8px 0}.option.good{outline:2px solid var(--accent)}.option.bad{outline:2px solid var(--bad)}
textarea,input{width:100%;background:#07111e;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;min-height:44px}textarea{min-height:170px}
.kpi{font-size:30px;font-weight:900}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}
@media(max-width:650px){.split{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:14px}button{min-height:44px}}

/* v20 release polish */
html{scroll-behavior:smooth}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}.card{box-shadow:0 8px 28px rgba(0,0,0,.12)}
nav{-webkit-overflow-scrolling:touch;scrollbar-width:thin}nav button{white-space:nowrap;flex:0 0 auto}
@media(max-width:650px){header{padding:10px 12px}.brand{font-size:17px}nav{gap:6px}.wrap{padding:10px}.grid{grid-template-columns:1fr}.kpi{font-size:26px}textarea{min-height:150px}button,.btn{padding:11px 12px}}
@media(min-width:1000px){.wrap{max-width:1180px}}

</style></head>

function officeTicket(){
 document.querySelector('#app').innerHTML=`<button onclick="render()">← Workplace</button><div class="card"><h1>Create defect</h1>

function saveTicket(){
 let t=document.querySelector('#otitle').value.trim(),b=document.querySelector('#obody').value.trim(),l=b.toLowerCase();
 let ok=t.length>8&&b.length>90&&/expected/.test(l)&&/actual/.test(l)&&(/step/.test(l)||/repro/.test(l));
 if(ok){let o=os();o.tickets.push({id:"BUG-"+(100+o.tickets.length),title:t,severity:document.querySelector('#osev').value,status:"OPEN",body:b});bump("Defect Reporting",12);bump("Communication",6);state.xp+=75;save()}
 document.querySelector('#ofb').innerHTML=`<p><strong>${ok?'Ticket created ✓':'Needs more detail'}</strong></p>`}
function ticketBoard(){
 let o=os();document.querySelector('#app').innerHTML=`<button onclick="render()">← Workplace</button><h1>Jira Board</h1>${o.tickets.length?o.tickets.map((t,i)=>`<div class="card phase"><h2>${t.id}: ${escapeHtml(t.title)}</h2><span class="badge">${t.severity}</span><span class="badge">${t.status}</span><p>${escapeHtml(t.body)}</p><select onchange="ticketStatus(${i},this.value)">${["OPEN","IN PROGRESS","READY FOR QA","VERIFIED","FAILED RETEST","CLOSED"].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<div class="card">No tickets yet.</div>'}`}

function officeTest(){
 document.querySelector('#app').innerHTML=`<button onclick="render()">← Workplace</button><div class="card"><h1>Create test case</h1><input id="tt" placeholder="Test title"><textarea id="ts" placeholder="Preconditions, test data, steps and expected result"></textarea><button class="primary" onclick="saveTest()">Save case</button><div id="tfb"></div></div>`}
function saveTest(){let t=document.querySelector('#tt').value.trim(),s=document.querySelector('#ts').value.trim(),l=s.toLowerCase(),ok=t.length>6&&s.length>60&&/expected/.test(l)&&(/step/.test(l)||s.split("\n").length>=3);if(ok){os().tests.push({id:"TC-"+(1+os().tests.length),title:t,steps:s});bump("Test Design",10);state.xp+=50;save()}document.querySelector('#tfb').innerHTML=`<p><strong>${ok?'Test saved ✓':'Add executable steps and an expected result.'}</strong></p>`}
function testRun(){

const SHOP_REQ=[
"R1 — Product quantity must be an integer from 1 to 10.",

function sb(){state.sandbox=state.sandbox||{bugs:{},cases:[],evidence:[],orders:0};return state.sandbox}
function sandbox(){
 let s=sb();
 return `<h1>Live QA Sandbox</h1><p class="muted">Test this deliberately buggy mini-store against the requirements. Some behaviours are intentionally wrong. Find them through testing, then record professional evidence.</p>
 <div class="split">
 <div><div class="card"><h2>Requirements</h2>${SHOP_REQ.map(x=>`<p>${x}</p>`).join('')}</div>
 <div class="card"><h2>Staging Shop — build 4.0.0</h2>
 <p><strong>QA Headphones</strong> — £50.00</p>
 <label>Quantity</label><input id="qty" type="number" value="1">
 <label>Promo code</label><input id="promo" placeholder="Optional">
 <button onclick="calcBasket()">Update basket</button>
 <div id="basket" class="card" style="margin-top:10px">Total: £50.00</div>
 <label>Email</label><input id="email" placeholder="you@example.com">
 <button id="checkoutBtn" class="primary" onclick="checkoutBuggy()">Checkout</button>
 <div id="orderMsg"></div></div></div>
 <div><div class="card"><h2>Test Case Manager</h2><input id="tcTitle" placeholder="Test case title"><textarea id="tcSteps" placeholder="Steps and expected result"></textarea><button onclick="addCase()">Add test case</button><div id="caseList">${renderCases()}</div></div>
 <div class="card"><h2>Evidence Log</h2><textarea id="evidence" placeholder="Record what you tested, data used, expected and actual result..."></textarea><button onclick="addEvidence()">Save evidence</button><div>${s.evidence.map((e,i)=>`<p><strong>E${i+1}</strong> ${escapeHtml(e)}</p>`).join('')}</div></div></div>

 <div class="card"><h2>Defect Desk</h2><p>When you believe you found a requirement violation, create a ticket. The simulator checks whether your report contains enough evidence.</p>

 <input id="bugSummary" placeholder="Defect summary">

}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function calcBasket(){
 let q=Number(document.querySelector('#qty').value), promo=document.querySelector('#promo').value.trim(), total=50*q;
 if(promo.toUpperCase()==='SAVE10') total-=5; // intentional bug: fixed £5, not 10% except qty 1
 document.querySelector('#basket').textContent=`Total: £${total.toFixed(2)}`;
 // intentional bug: checkout remains enabled for invalid/zero qty
}
function checkoutBuggy(){
 let q=Number(document.querySelector('#qty').value),email=document.querySelector('#email').value.trim();
 // intentional bug: weak email validation and duplicate fixed reference
 if(!email.includes('@')){document.querySelector('#orderMsg').innerHTML='<p class="bad">Email rejected.</p>';return}
 sb().orders++;save();document.querySelector('#orderMsg').innerHTML='<p class="done">Order placed: ORD-1000</p>';
}
function addCase(){
 let t=document.querySelector('#tcTitle').value.trim(),st=document.querySelector('#tcSteps').value.trim();
 if(t.length<4||st.length<15){alert('Add a useful title plus steps/expected result.');return}
 sb().cases.push({t,st});state.xp+=10;save();document.querySelector('#caseList').innerHTML=renderCases();
}
function renderCases(){let s=sb();return s.cases.length?s.cases.map((c,i)=>`<div class="module"><div><strong>TC${i+1}: ${escapeHtml(c.t)}</strong><br><span class="muted">${escapeHtml(c.st)}</span></div></div>`).join(''):'<p class="muted">No test cases yet.</p>'}
function addEvidence(){
 let e=document.querySelector('#evidence').value.trim();if(e.length<20){alert('Evidence needs more detail.');return}
 sb().evidence.push(e);state.xp+=10;save();render();
}
function submitBug(){
 let r=Number(document.querySelector('#bugReq').value),sum=document.querySelector('#bugSummary').value.trim(),body=document.querySelector('#bugBody').value.trim().toLowerCase();
 let planted={1:['quantity','0','10','integer'],3:['checkout','invalid','zero','empty'],4:['save10','10%','discount','total'],6:['order','reference','unique','ord-1000']};
 let terms=planted[r]||[],hits=terms.filter(x=>(sum.toLowerCase()+' '+body).includes(x)).length;
 let evidence=/expected/.test(body)&&/actual/.test(body)&&(/step/.test(body)||/repro/.test(body));
 let ok=terms.length&&hits>=2&&evidence&&body.length>=70;
 if(ok&&!sb().bugs[r]){sb().bugs[r]={summary:sum,body};state.xp+=100;save()}
 document.querySelector('#bugFeedback').innerHTML=`<div class="card" style="margin-top:10px"><strong>${ok?'VALID DEFECT ✓':'NOT VALIDATED YET'}</strong><p>${ok?'Good: the report identifies a planted requirement violation and includes reproducible expected/actual evidence.':'Check the requirement through the staging app and include reproducible steps/test data plus explicit expected and actual results. Not every requirement is currently broken.'}</p></div>`;
}

 {id:'sql',title:'4. SQL-backed validation',tool:'SQL / database',brief:'The UI says order #7842 is PAID for customer 118. Support says the customer was charged but the order disappeared from history. You have read-only database access.',ask:'Describe safe read-only queries/checks you would use to validate the order/customer/payment relationship and data state. Explain joins/filters and why QA should not alter production data.',keys:['select','join','where','payment','read']},

 {id:'ci',title:'6. CI pipeline failure investigation',tool:'CI/CD',brief:'PR checks show 148 passed, 1 failed. The failure is checkout_mobile_safari; screenshot shows the Pay button hidden by a banner. The same test failed twice.',ask:'Explain how QA handles the failed pipeline: inspect artifacts/logs, reproduce, distinguish product/test/environment causes, record evidence and avoid blindly rerunning until green.',keys:['artifact','repro','environment','evidence','rerun']},
 {id:'trace',title:'7. Tool-to-tool traceability',tool:'Jira + tests + PR + CI',brief:'Requirement PAY-22 has acceptance criteria, defect BUG-91, fix PR #412 and CI run #8871. The release manager asks whether the fix is ready.',ask:'Build a concise traceability story linking requirement → test evidence → defect → fix → confirmation/regression → CI result. State remaining uncertainty instead of just saying “passed”.',keys:['requirement','defect','regression','ci','risk']},
 {id:'capstone',title:'8. Professional tooling incident',tool:'Integrated toolchain',brief:'Release candidate 3 has a payment API contract mismatch, a reproducible Safari UI blocker, clean database records for successful desktop orders and one failing mobile CI check. Product wants a QA status now.',ask:'Write a tool-evidence-based QA status update. Separate verified facts, defects, coverage, links/artifacts you would provide, unresolved risk and recommended next QA actions without making the business release decision for them.',keys:['api','safari','database','ci','risk']}
];
function t18s(){state.tooling18=state.tooling18||{answers:{},passed:{},started:Date.now()};return state.tooling18}
function tooling18(){let s=t18s(),n=Object.keys(s.passed).length,pc=Math.round(n/TOOL18_TASKS.length*100);return `<h1>Professional Tooling Simulation — v18</h1><p class="muted">One connected workplace-style toolchain. Treat every tool as a source of evidence, not a checkbox.</p><div class="grid"><div class="card"><div class="muted">Tool missions passed</div><div class="kpi">${n}/8</div></div><div class="card"><div class="muted">Simulation progress</div><div class="kpi">${pc}%</div></div></div>${TOOL18_TASKS.map((t,i)=>`<div class="card phase"><div class="muted">${t.tool}</div><h2>${s.passed[t.id]?'✓ ':''}${t.title}</h2><p>${t.brief}</p><button ${i>0&&!s.passed[TOOL18_TASKS[i-1].id]?'disabled':''} onclick="openTooling18('${t.id}')">${s.passed[t.id]?'Review evidence':'Start mission'}</button></div>`).join('')}${n===8?'<div class="card"><h2>Professional Tooling Simulation complete ✓</h2><p>You have connected defect management, DevTools, API evidence, SQL validation, Git/PR collaboration and CI results into a traceable QA workflow. Next roadmap stage: v19 Final Career Assessment.</p></div>':''}`}
function openTooling18(id){let s=t18s(),t=TOOL18_TASKS.find(x=>x.id===id),i=TOOL18_TASKS.indexOf(t);if(i>0&&!s.passed[TOOL18_TASKS[i-1].id])return;document.querySelector('#app').innerHTML=`<button onclick="render()">← Professional Tooling</button><div class="card" style="margin-top:12px"><div class="muted">${t.tool} · Mission ${i+1}/8</div><h1>${t.title}</h1><p>${t.brief}</p><h3>Your QA work</h3><p>${t.ask}</p><textarea id="tool18Answer" placeholder="Use concrete tool evidence, checks, links/traceability and risk reasoning...">${escapeHtml(s.answers[id]||'')}</textarea><button class="primary" onclick="gradeTooling18('${id}')">Submit work</button><div id="tool18Feedback"></div></div>`}
function gradeTooling18(id){let s=t18s(),t=TOOL18_TASKS.find(x=>x.id===id),v=(document.querySelector('#tool18Answer').value||'').trim(),low=v.toLowerCase(),hits=t.keys.filter(k=>low.includes(k)).length,ok=v.length>=120&&hits>=4;s.answers[id]=v;if(ok&&!s.passed[id]){s.passed[id]=true;state.xp+=250}save();let miss=t.keys.filter(k=>!low.includes(k)).slice(0,3);document.querySelector('#tool18Feedback').innerHTML=`<div class="card" style="margin-top:10px"><strong>${ok?'TOOL MISSION PASS ✓':'MORE TOOL EVIDENCE NEEDED'}</strong><p>${ok?'Good. You connected the tool output to reproducible QA evidence and team decisions.':'Add specific evidence you would inspect or record and show how it connects across the QA workflow.'}</p>${!ok&&miss.length?`<p class="muted">Consider addressing: ${miss.join(', ')}.</p>`:''}${ok?'<button onclick="render()">Continue tooling simulation</button>':''}</div>`}


// v19 — Final Career Assessment: independent, evidence-led capstone.
const FINAL19_TASKS=[
 {id:'req',title:'1. Requirements & risk analysis',brief:'New product: QuickClinic lets patients book, reschedule and cancel appointments. Requirement: “Patients can change appointments easily, and reminders should stay accurate.” Rules are incomplete. Payment is required for some appointment types.',ask:'Independently identify ambiguities, questions, assumptions, dependencies, highest risks and testable acceptance ideas. Prioritise what QA needs clarified before execution.',keys:['clarif','risk','payment','reminder','accept']},
 {id:'plan',title:'2. Test strategy under constraint',brief:'You have 90 minutes, Chrome desktop and iPhone Safari. Changed areas: rescheduling, payment confirmation, reminder scheduling. Profile avatar styling also changed.',ask:'Create a risk-based test plan: scope, priorities, environments, data, positive/negative/boundary coverage, what you defer and how you report residual risk.',keys:['safari','payment','boundary','defer','risk']},
 {id:'execute',title:'3. Execution & exploratory evidence',brief:'Observed: Chrome reschedule succeeds and confirmation shows new time. Safari at 320px hides Confirm behind a sticky banner. Cancelling then rebooking the same slot sometimes shows “unavailable” until refresh.',ask:'Turn these observations into structured evidence. Separate confirmed defect(s), exploratory lead(s), environment details, expected/actual behaviour and next investigation steps.',keys:['safari','expected','actual','repro','refresh']},
 {id:'api',title:'4. API investigation',brief:'PATCH /appointments/551 with valid newTime returns 200 but body contains reminderTime for the old appointment. Contract says reminderTime must reflect the current booking. Invalid appointment id returns 404 as documented.',ask:'Assess the API evidence, propose focused follow-up requests/assertions, explain likely user risk without guessing root cause, and state what evidence belongs in the defect.',keys:['200','reminder','contract','assert','evidence']},
 {id:'data',title:'5. Data validation',brief:'UI shows appointment 551 at 15:30. Read-only DB results show appointments.time=15:30 but reminders.scheduled_for=13:00 based on the former 14:00 booking.',ask:'Explain safe SQL/data checks to validate relationships and consistency. Correlate UI/API/DB evidence and state what is proven versus what still needs engineering investigation.',keys:['select','join','reminder','15:30','evidence']},
 {id:'defect',title:'6. Defect & triage package',brief:'You now have a reproducible Safari blocker plus confirmed stale reminder data after reschedule. Product asks which issue is “more important.”',ask:'Write a concise triage package for both issues: titles, severity/impact reasoning, reproducibility/evidence, affected users, dependencies and facts the team needs to set priority. Do not substitute QA opinion for the team’s business decision.',keys:['severity','impact','safari','reminder','priority']},
 {id:'retest',title:'7. Fix verification & regression',brief:'Developer fixes both issues. Safari Confirm is visible. API now returns the new reminderTime. Changes touched shared appointment update logic used by cancellation and booking.',ask:'Design confirmation tests and targeted regression across UI/API/data. Include negative paths, shared-component risk and evidence required before closing the defects.',keys:['confirmation','regression','cancel','api','data']},
 {id:'report',title:'8. Final QA release report',brief:'Final results: critical booking/reschedule/payment paths pass on Chrome and Safari; both confirmed defects pass retest; targeted regression passes; avatar styling was not tested; Android was unavailable; one intermittent slot-refresh lead could not be reproduced again.',ask:'Produce a professional final QA report separating tested scope, results, fixed defects, untested scope, unresolved uncertainty and residual risk. Give decision-useful evidence without claiming QA can guarantee quality.',keys:['scope','pass','untested','risk','intermitt']},
 {id:'interview',title:'9. Hiring-manager debrief',brief:'An interviewer asks: “Tell me how you approached this assessment and what you would improve with another day.”',ask:'Answer using a concise STAR-style structure. Demonstrate risk-based thinking, evidence, communication, tooling and one credible improvement rather than claiming everything was perfect.',keys:['situation','task','action','result','improv']},
 {id:'reflection',title:'10. Personal development plan',brief:'This is the final assessment before the v20 release candidate.',ask:'Identify three concrete QA strengths demonstrated here, three skills to improve, and a 30-day practice plan with measurable actions covering manual testing plus at least one technical/tool skill.',keys:['strength','improv','30','practice','tool']}
];
function f19s(){state.final19=state.final19||{answers:{},passed:{},started:Date.now(),completedAt:null};return state.final19}
function final19Score(){let s=f19s();return Math.round(Object.keys(s.passed).length/FINAL19_TASKS.length*100)}
function final19(){let s=f19s(),n=Object.keys(s.passed).length,pc=final19Score();if(n===10&&!s.completedAt){s.completedAt=new Date().toISOString();save()}return `<h1>Final Career Assessment — v19</h1><p class="muted">Independent capstone. The scenario is deliberately less guided: build defensible QA evidence and communicate uncertainty professionally.</p><div class="grid"><div class="card"><div class="muted">Assessment tasks passed</div><div class="kpi">${n}/10</div></div><div class="card"><div class="muted">Assessment completion</div><div class="kpi">${pc}%</div></div></div>${FINAL19_TASKS.map((t,i)=>`<div class="card phase"><div class="muted">${i<2?'Analysis & planning':i<5?'Investigation':i<7?'Defects & verification':i<9?'Reporting & interview':'Development plan'}</div><h2>${s.passed[t.id]?'✓ ':''}${t.title}</h2><p>${t.brief}</p><button ${i>0&&!s.passed[FINAL19_TASKS[i-1].id]?'disabled':''} onclick="openFinal19('${t.id}')">${s.passed[t.id]?'Review submission':'Start assessment task'}</button></div>`).join('')}${n===10?'<div class="card"><h2>Final Career Assessment complete ✓</h2><p>You completed the independent capstone from requirement analysis through release reporting and interview reflection. Your submissions remain stored in your academy save so they can be reviewed as career-practice evidence.</p><p><strong>Next: v20 — final release candidate, polish and full QA.</strong></p></div>':''}`}
function openFinal19(id){let s=f19s(),t=FINAL19_TASKS.find(x=>x.id===id),i=FINAL19_TASKS.indexOf(t);if(i>0&&!s.passed[FINAL19_TASKS[i-1].id])return;document.querySelector('#app').innerHTML=`<button onclick="render()">← Final Assessment</button><div class="card" style="margin-top:12px"><div class="muted">Independent task ${i+1}/10</div><h1>${t.title}</h1><p>${t.brief}</p><h3>Your submission</h3><p>${t.ask}</p><textarea id="final19Answer" placeholder="Write as if this evidence will be reviewed by a QA lead or hiring manager...">${escapeHtml(s.answers[id]||'')}</textarea><button class="primary" onclick="gradeFinal19('${id}')">Submit assessment work</button><div id="final19Feedback"></div></div>`}
function gradeFinal19(id){let s=f19s(),t=FINAL19_TASKS.find(x=>x.id===id),v=(document.querySelector('#final19Answer').value||'').trim(),low=v.toLowerCase(),hits=t.keys.filter(k=>low.includes(k)).length,ok=v.length>=140&&hits>=4;s.answers[id]=v;if(ok&&!s.passed[id]){s.passed[id]=true;state.xp+=300}if(Object.keys(s.passed).length===10&&!s.completedAt)s.completedAt=new Date().toISOString();save();let miss=t.keys.filter(k=>!low.includes(k)).slice(0,3);document.querySelector('#final19Feedback').innerHTML=`<div class="card" style="margin-top:10px"><strong>${ok?'ASSESSMENT TASK PASS ✓':'SUBMISSION NEEDS MORE EVIDENCE'}</strong><p>${ok?'Your submission demonstrates concrete QA reasoning, evidence and professional communication.':'Develop the response with specific observations, risks, evidence and actions rather than broad testing statements.'}</p>${!ok&&miss.length?`<p class="muted">Review these areas: ${miss.join(', ')}.</p>`:''}${ok?'<button onclick="render()">Continue assessment</button>':''}</div>`}


// v20 — Final Release Center
function releaseMetrics20(){
 const advanced=state.advanced16?Object.keys(state.advanced16.passed||{}).length:0;
 const auto=state.auto17?Object.keys(state.auto17.passed||{}).length:0;
 const tooling=state.tooling18?Object.keys(state.tooling18.passed||{}).length:0;
 const final=state.final19?Object.keys(state.final19.passed||{}).length:0;
 const sprint=state.sprint15?Object.keys(state.sprint15.passed||{}).length:(state.sprint?Object.keys(state.sprint.passed||{}).length:0);
 return {academy:pct(),labs:Object.keys(state.labs||{}).length,advanced,auto,tooling,final,sprint};
}
function release20(){
 let m=releaseMetrics20();
 let achievements=[
  ['Foundation Builder',m.academy>=50,'Complete at least 50% of core Academy modules'],
  ['Academy Mastery',m.academy>=85,'Reach 85%+ core Academy mastery'],
  ['Hands-on Tester',m.labs>=Math.ceil(DATA.labs.length*.75),'Complete at least 75% of practical labs'],
  ['Advanced Investigator',m.advanced===8,'Pass all eight v16 advanced challenges'],
  ['Automation Aware',m.auto===8,'Complete all eight Automation Foundations exercises'],
  ['Toolchain Ready',m.tooling===8,'Complete all eight Professional Tooling missions'],
  ['Career Capstone',m.final===10,'Complete all ten Final Career Assessment tasks'],
  ['CTFL Practice Target',(state.certBest||0)>=65,'Score at least 65% on the internal CTFL-style practice mock']
 ];
 let unlocked=achievements.filter(a=>a[1]).length;
 return `<h1>v20 Final Release Center</h1><p class="muted">Your completion and career-evidence hub. This is an internal training record, not a professional certification or guarantee of employment.</p>
 <div class="grid"><div class="card"><div class="muted">Release achievements</div><div class="kpi">${unlocked}/${achievements.length}</div></div><div class="card"><div class="muted">Core Academy</div><div class="kpi">${m.academy}%</div></div><div class="card"><div class="muted">Final assessment</div><div class="kpi">${m.final}/10</div></div><div class="card"><div class="muted">XP earned</div><div class="kpi">${state.xp||0}</div></div></div>
 <div class="card" style="margin-top:12px"><h2>Achievements</h2>${achievements.map(a=>`<div class="module"><div><strong>${a[1]?'✓ ':'○ '}${a[0]}</strong><div class="muted">${a[2]}</div></div><span class="badge">${a[1]?'Unlocked':'In progress'}</span></div>`).join('')}</div>
 <div class="card" style="margin-top:12px"><h2>Career evidence you can review</h2><p>Your saved work includes practical lab responses, workplace simulations, release/sprint decisions, advanced investigations, automation reasoning, professional tooling evidence and the v19 QuickClinic capstone.</p><button onclick="view='final19';render()">Review final assessment</button> <button onclick="view='portfolio';render()">Open portfolio & interview</button> <button onclick="view='backup';render()">Backup progress</button></div>
 <div class="card" style="margin-top:12px"><h2>Release readiness checklist</h2>
 <div class="module"><span>Core knowledge benchmark</span><strong>${m.academy>=85?'✓ Ready':'Continue Academy'}</strong></div>
 <div class="module"><span>Advanced real-world scenarios</span><strong>${m.advanced===8?'✓ Complete':m.advanced+'/8'}</strong></div>
 <div class="module"><span>Automation foundations</span><strong>${m.auto===8?'✓ Complete':m.auto+'/8'}</strong></div>
 <div class="module"><span>Professional tooling</span><strong>${m.tooling===8?'✓ Complete':m.tooling+'/8'}</strong></div>
 <div class="module"><span>Independent career assessment</span><strong>${m.final===10?'✓ Complete':m.final+'/10'}</strong></div></div>`;
}

const toolList=[
['Jira','Create issues, defects, priorities, workflows and professional evidence'],
['Test Management','Suites, cases, runs, results and traceability'],
['Chrome DevTools','Elements, Console, Network and Storage investigation'],
['Postman / API','HTTP methods, headers, JSON, auth and response validation'],
['SQL','Read-only queries, filters, joins and backend validation'],
['Git / GitHub','Repos, branches, commits, PRs and QA collaboration'],
['Swagger / OpenAPI','Read endpoint contracts and design API checks'],
['Accessibility','Keyboard, semantics, WCAG-oriented checks and evidence'],
['Performance','Workloads, response metrics and JMeter-style concepts'],
['Playwright / Selenium','Selectors, assertions and automation fundamentals'],
['CI/CD','Builds, pipelines, automated results and release gates']];
function tools(){return `<h1>QA Tools Lab</h1><p class="muted">Track competence separately from course completion. Each tool uses five levels.</p>`+toolList.map((t,i)=>{let v=state.tool[i]||0;return `<div class="card phase"><h2>${t[0]}</h2><p>${t[1]}</p><div class="bar"><i style="width:${v*25}%"></i></div><p>Level ${v}/4 — ${['Untrained','Beginner','Practised','Competent','Workplace Ready'][v]}</p><button onclick="toolUp(${i})">Complete next guided competency</button></div>`}).join('')}
function toolUp(i){state.tool[i]=Math.min(4,(state.tool[i]||0)+1);state.xp+=25;save();render()}
function cert(){return `<div class="card"><h1>ISTQB CTFL Preparation</h1><p>This area prepares you for Foundation-level concepts using original practice questions. It does <strong>not</strong> award an ISTQB/BCS qualification.</p><p>Full mock: 40 questions · 60-minute target · 65% practice pass target.</p><button class="primary" onclick="startCert()">Start 40-question mock</button><p>Best score: ${state.certBest}%</p></div>`}
let certRun=null;
function startCert(){certRun={i:0,score:0,start:Date.now()};showCert()}
function showCert(){let c=certRun;if(c.i>=DATA.certQuestions.length){let pc=Math.round(c.score/40*100);state.certBest=Math.max(state.certBest,pc);state.xp+=pc>=65?200:50;if(state.assess){state.assess.mocks=state.assess.mocks||[];state.assess.mocks.push({score:pc,date:new Date().toISOString()});}save();document.querySelector('#app').innerHTML=`<div class="card"><h1>Mock complete</h1><div class="kpi">${pc}%</div><p>${c.score}/40. Practice target: 65%.</p><button onclick="render()">Return</button></div>`;return}let q=DATA.certQuestions[c.i];document.querySelector('#app').innerHTML=`<div class="card"><div class="muted">Question ${c.i+1}/40</div><h2>${q.q}</h2>${q.options.map(o=>`<button class="option" onclick='certAnswer(${JSON.stringify(o)})'>${o}</button>`).join('')}</div>`}
function certAnswer(o){let q=DATA.certQuestions[certRun.i];if(o==q.correct)certRun.score++;certRun.i++;showCert()}
function career(){let toolAvg=toolList.reduce((s,_,i)=>s+(state.tool[i]||0),0)/(toolList.length*4)*100, lp=Object.keys(state.labs).length/DATA.labs.length*100, ap=pct();let ready=ap>=85&&lp>=75&&toolAvg>=65&&state.certBest>=65;return `<h1>Job-Ready Gate</h1><div class="grid">
<div class="card"><div class="muted">Knowledge</div><div class="kpi">${ap}%</div></div><div class="card"><div class="muted">Practical labs</div><div class="kpi">${Math.round(lp)}%</div></div><div class="card"><div class="muted">Tool competence</div><div class="kpi">${Math.round(toolAvg)}%</div></div><div class="card"><div class="muted">Certification mock</div><div class="kpi">${state.certBest}%</div></div></div>
<div class="card" style="margin-top:12px"><h2>${ready?'Job-Ready Gate unlocked ✓':'Job-Ready Gate locked'}</h2><p>Unlock rule: 85% academy, 75% practical labs, 65% tool competence and a 65%+ certification mock. This is an internal training benchmark, not a guarantee of employment or professional accreditation.</p></div>`}
function backup(){return `<div class="card"><h1>Save & Backup</h1><p>Your progress automatically saves on this browser/device using local storage.</p><button onclick="exportSave()">Export progress</button><p>To move progress to another device, export the save and import it there.</p><textarea id="import" placeholder="Paste exported save data here"></textarea><button onclick="importSave()">Import progress</button><button class="danger" onclick="resetAll()">Reset all progress</button></div>`}
function exportSave(){let blob=new Blob([JSON.stringify(state)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qa-career-academy-progress.json';a.click()}
function importSave(){try{let incoming=JSON.parse(document.querySelector('#import').value);if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('Invalid save');state=Object.assign({xp:0,completed:{},quizScores:{},labs:{},tool:{},certBest:0,started:Date.now()},incoming);state.completed=state.completed||{};state.quizScores=state.quizScores||{};state.labs=state.labs||{};state.tool=state.tool||{};save();render();alert('Progress imported successfully')}catch(e){alert('That save data is not valid. Your existing progress was not replaced.')}}
function resetAll(){if(confirm('Reset ALL academy progress?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
